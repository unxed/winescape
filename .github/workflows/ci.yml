name: ci

# There is no other CI here, and the library cannot be judged without a real
# Wine: everything it does is a raw syscall from a Windows process, and a Wine
# release that stopped allowing that would break it silently. So the second job
# runs the end-to-end runner under Wine, and is the one that matters.

on:
  push:
    branches: [ main, 'spawn-pty' ]
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Portable tests and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Generated files match the syscall table
        run: |
          go run ./cmd/gen-numbers .
          git status --short
          git diff --exit-code

  wine:
    name: End-to-end under Wine (linux/amd64 host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WINEDEBUG: "-all"
      WINEARCH: win64
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine64
          wine64 --version || wine --version
      - name: Build the runner for Windows
        run: |
          mkdir -p build
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o build/test_runner.exe ./cmd/test-runner
      - name: Initialise the Wine prefix
        run: |
          (wine64 wineboot --init || wine wineboot --init) || true
          sleep 5
      - name: Run the end-to-end suite
        run: |
          W=$(command -v wine64 || command -v wine)
          $W build/test_runner.exe 2>&1 | tee build/runner.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Package tests under Wine
        # Informational: these were never run in CI before.
        continue-on-error: true
        run: |
          W=$(command -v wine64 || command -v wine)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -exec "$W" ./go/... 2>&1 | tee build/gotest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-logs
          path: build/*.log
